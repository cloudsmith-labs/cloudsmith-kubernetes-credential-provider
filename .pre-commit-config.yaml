repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: mise run format --
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: mise run vet
        language: system
        pass_filenames: false
      - id: go-test
        name: go test
        entry: mise run test
        language: system
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: mise run lint
        language: system
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: mise run actions-security
        language: system
        pass_filenames: false
